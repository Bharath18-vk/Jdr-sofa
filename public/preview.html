<!DOCTYPE html>

<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1614; color: #f5f1e9; padding: 24px; margin: 0; }
h1 { font-family: serif; color: #d8c8b5; font-size: 28px; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

img { width: 100%; height: 180px; object-fit: cover; border-radius: 2px; }
h4 { margin: 8px 0 4px; font-size: 11px; font-family: monospace; color: #c5a880; word-break: break-all; }
p { margin: 0; font-size: 12px; color: #bbb; }
</style>
</head>
